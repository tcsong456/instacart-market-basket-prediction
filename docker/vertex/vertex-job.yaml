workerPoolSpecs:
  - machineSpec:
      machineType: n1-standard-4
      acceleratorType: NVIDIA_TESLA_T4
      acceleratorCount: 1

    replicaCount: 1

    containerSpec:
      imageUri: europe-west1-docker.pkg.dev/instacart-basket-prediction/ml/instacart-ml:local

      args:
        - "-m"
        - "instacart_rnn.train"
        - "--model"
        - "product"
        - "--train-path"
        - "gs://instacart-gold-fc45ebb3/training/sample/initial/product_training_data_train"
        - "--validation-path"
        - "gs://instacart-gold-fc45ebb3/training/sample/initial/product_training_data_validation"
        - "--checkpoint-path"
        - "gs://instacart-gold-fc45ebb3"
        - "--pin-memory"
        - "--amp"
        - "--early-stopping"
        - "2"

scheduling:
  strategy: SPOT