dataset:
  name: order_products
  allow_extra_columns: false

  grain:
    - order_id
    - product_id

schema:
  - name: product_id
    type: integer
    nullable: false
    constraints:
      minimum: 1

  - name: order_id
    type: integer
    nullable: false
    constraints:
      minimum: 1

  - name: add_to_cart_order
    type: integer
    nullable: false
    constraints:
      minimum: 1

  - name: reordered
    type: integer
    nullable: false
    constraints:
      allowed_values:
        - 0
        - 1

  - name: user_id
    type: integer
    nullable: false
    constraints:
      minimum: 1

  - name: eval_set
    type: string
    nullable: false
    constraints:
      allowed_values:
        - prior
        - train

  - name: order_number
    type: integer
    nullable: false
    constraints:
      minimum: 1

  - name: days_since_prior_order
    type: double
    nullable: false
    constraints:
      minimum: -1
      maximum: 30

  - name: product_name
    type: string
    nullable: false
    constraints:
      minimum_string_length: 1

rules:
  - name: first_order_has_no_prior_interval
    description: >
      The first order for a user must use -1 as the sentinel value
      for days_since_prior_order.
    expression: >
      order_number <> 1 OR days_since_prior_order = -1
  
  - name: later_orders_have_prior_interval
    description: >
      Orders after the first must have a non-negative prior-order interval.
    expression: >
      order_number = 1 OR days_since_prior_order >= 0