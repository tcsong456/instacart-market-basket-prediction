dataset:
  name: orders
  allow_extra_columns: True

  grain:
    - order_id

schema:
  - name: order_id
    type: integer
    nullable: false
    constraints:
      unique: true
      minimum: 1
    thresholds:
      uniqueness:
        max_failed_percent: 0.0
        severity: critical

  - name: user_id
    type: integer
    nullable: false
    constraints:
      minimum: 1

  - name: eval_set
    type: string
    nullable: false
    constraints:
      allowed_values:
        - prior
        - train
        - test

  - name: order_number
    type: integer
    nullable: false
    constraints:
      minimum: 1

  - name: days_since_prior_order
    type: double
    nullable: true
    constraints:
      minimum: 1
      maximum: 30

relationships:
  - name: orders_user_fk
    type: foreign_key
    child_columns:
      - user_id
    parent:
      dataset: users
      columns:
        - user_id

derived_fields:
  - name: user_max_order_number
    aggregation: max
    column: order_number
    partition_by:
      - user_id

  - name: train_or_test_count
    aggregation: conditional_count
    condition: >
      eval_set IN ('train', 'test')
    partition_by:
      - user_id

  - name: is_last_order
    expression: >
      order_number = user_max_order_number

rules:
  - name: first_order_has_no_prior_interval
    expression: >
      order_number <> 1
      OR days_since_prior_order IS NULL

  - name: later_orders_must_have_prior_interval
    expression: >
      order_number = 1
      OR days_since_prior_order IS NOT NULL

  - name: last_order_is_train_or_test
    expression: >
      NOT is_last_order
      OR eval_set IN ('train', 'test')

  - name: exactly_one_train_or_test_per_user
    expression: >
      train_or_test_count = 1