dataset:
  name: available_orders
  description: >
    Order-level simulation dataset defining deterministic user cohorts,
    simulated arrival periods, and the cumulative orders available for
    training and validation at a given model lifecycle period.

    For established users:
      initial:
        train      = orders 1..N-3
        validation = orders 1..N-2
      t1:
        train      = orders 1..N-2
        validation = orders 1..N-1
      t2:
        train      = orders 1..N-1
        validation = orders 1..N

    For a new user during their arrival period:
      train      = orders 1..N-1
      validation = orders 1..N

    A new user that arrived in a previous period contributes all known
    orders to training and does not participate in validation.

    New users that have not yet arrived, final holdout users, and
    excluded users are unavailable for both training and validation.

  grain:
    - order_id

  allow_extra_columns: false


schema:
  - name: user_id
    type: integer
    nullable: false
    constraints:
      minimum: 1

  - name: order_id
    type: integer
    nullable: false
    constraints:
      unique: true
      minimum: 1

  - name: eval_set
    type: string
    nullable: false
    constraints:
      allowed_values:
        - prior
        - train

  - name: order_number
    type: integer
    nullable: false
    constraints:
      minimum: 1

  - name: order_dow
    type: integer
    nullable: false
    constraints:
      minimum: 0
      maximum: 6

  - name: order_hour_of_day
    type: integer
    nullable: false
    constraints:
      minimum: 0
      maximum: 23

  - name: days_since_prior_order
    type: double
    nullable: true
    constraints:
      minimum: 0

  - name: order_history
    type: integer
    nullable: false
    constraints:
      minimum: 1

  - name: user_cohort
    type: string
    nullable: false
    constraints:
      allowed_values:
        - established
        - new_user
        - final_holdout
        - excluded

  - name: development_split
    type: string
    nullable: true
    constraints:
      allowed_values:
        - base_train
        - stacking_train

  - name: arrival_period
    type: string
    nullable: true
    constraints:
      allowed_values:
        - t1
        - t2

  - name: simulation_period
    type: string
    nullable: false
    constraints:
      allowed_values:
        - initial
        - validation
        - t1
        - t2
        - new_user_pool
        - final_holdout
        - excluded

  - name: current_period
    type: string
    nullable: false
    constraints:
      allowed_values:
        - initial
        - t1
        - t2

  - name: is_train_available
    type: boolean
    nullable: false

  - name: is_validation_available
    type: boolean
    nullable: false

  - name: is_evaluation_available
    type: boolean
    nullable: false

derived_fields:
  - name: min_order_number
    aggregation: min
    column: order_number
    partition_by:
      - user_id

  - name: max_order_number
    aggregation: max
    column: order_number
    partition_by:
      - user_id

  - name: order_count
    aggregation: count
    column: order_number
    partition_by:
      - user_id

  - name: order_history_count
    aggregation: count_distinct
    column: order_history
    partition_by:
      - user_id

  - name: user_cohort_count
    aggregation: count_distinct
    column: user_cohort
    partition_by:
      - user_id

  - name: development_split_count
    aggregation: count_distinct
    column: development_split
    partition_by:
      - user_id

  - name: arrival_period_count
    aggregation: count_distinct
    column: arrival_period
    partition_by:
      - user_id

  - name: current_period_count
    aggregation: count_distinct
    column: current_period
    partition_by:
      - user_id


rules:
  - name: first_order_has_no_prior_interval
    expression: >
      order_number <> 1
      OR days_since_prior_order IS NULL

  - name: later_orders_have_prior_interval
    expression: >
      order_number = 1
      OR days_since_prior_order IS NOT NULL

  - name: order_number_does_not_exceed_history
    expression: >
      order_number <= order_history

  - name: order_history_matches_max_order_number
    expression: >
      max_order_number = order_history

  - name: order_numbers_start_at_one
    expression: >
      min_order_number = 1

  - name: order_count_matches_history
    expression: >
      order_count = order_history

  - name: order_history_is_constant_per_user
    expression: >
      order_history_count = 1

  - name: user_cohort_is_constant_per_user
    expression: >
      user_cohort_count = 1

  - name: established_users_have_sufficient_history
    expression: >
      user_cohort <> 'established'
      OR order_history >= 6

  - name: new_users_have_expected_history
    expression: >
      user_cohort <> 'new_user'
      OR order_history BETWEEN 3 AND 5

  - name: excluded_users_have_less_than_three_orders
    expression: >
      user_cohort <> 'excluded'
      OR order_history < 3

  - name: development_split_only_for_established
    expression: >
      (
        user_cohort = 'established'
        AND development_split IN ('base_train', 'stacking_train')
      )
      OR (
        user_cohort <> 'established'
        AND development_split IS NULL
      )

  - name: established_development_split_is_constant
    expression: >
      user_cohort <> 'established'
      OR development_split_count = 1

  - name: arrival_period_only_for_new_users
    expression: >
      (
        user_cohort = 'new_user'
        AND arrival_period IN ('t1', 't2')
      )
      OR (
        user_cohort <> 'new_user'
        AND arrival_period IS NULL
      )

  - name: new_user_arrival_period_is_constant
    expression: >
      user_cohort <> 'new_user'
      OR arrival_period_count = 1

  - name: current_period_is_constant
    expression: >
      current_period_count = 1

  - name: final_holdout_simulation_period_is_correct
    expression: >
      user_cohort <> 'final_holdout'
      OR simulation_period = 'final_holdout'

  - name: excluded_simulation_period_is_correct
    expression: >
      user_cohort <> 'excluded'
      OR simulation_period = 'excluded'

  - name: new_user_simulation_period_is_correct
    expression: >
      user_cohort <> 'new_user'
      OR simulation_period = 'new_user_pool'

  - name: established_simulation_period_is_correct
    expression: >
      user_cohort <> 'established'
      OR (
        (
          order_number <= order_history - 3
          AND simulation_period = 'initial'
        )
        OR (
          order_number = order_history - 2
          AND simulation_period = 'validation'
        )
        OR (
          order_number = order_history - 1
          AND simulation_period = 't1'
        )
        OR (
          order_number = order_history
          AND simulation_period = 't2'
        )
      )

  - name: established_initial_train_availability
    expression: >
      user_cohort <> 'established'
      OR current_period <> 'initial'
      OR is_train_available =
         (order_number <= order_history - 3)

  - name: established_initial_validation_availability
    expression: >
      user_cohort <> 'established'
      OR current_period <> 'initial'
      OR is_validation_available =
         (order_number <= order_history - 2)

  - name: established_t1_train_availability
    expression: >
      user_cohort <> 'established'
      OR current_period <> 't1'
      OR is_train_available =
         (order_number <= order_history - 2)

  - name: established_t1_validation_availability
    expression: >
      user_cohort <> 'established'
      OR current_period <> 't1'
      OR is_validation_available =
         (order_number <= order_history - 1)

  - name: established_t2_train_availability
    expression: >
      user_cohort <> 'established'
      OR current_period <> 't2'
      OR is_train_available =
         (order_number <= order_history - 1)

  - name: established_t2_validation_availability
    expression: >
      user_cohort <> 'established'
      OR current_period <> 't2'
      OR is_validation_available =
         (order_number <= order_history)

  - name: new_users_are_unavailable_before_arrival
    expression: >
      user_cohort <> 'new_user'
      OR NOT (
        current_period = 'initial'
        OR (
          current_period = 't1'
          AND arrival_period = 't2'
        )
      )
      OR (
        is_train_available = false
        AND is_validation_available = false
      )

  - name: current_new_user_train_availability
    expression: >
      user_cohort <> 'new_user'
      OR arrival_period <> current_period
      OR is_train_available =
         (order_number <= order_history - 1)

  - name: current_new_user_validation_availability
    expression: >
      user_cohort <> 'new_user'
      OR arrival_period <> current_period
      OR is_validation_available =
         (order_number <= order_history)

  - name: previous_new_user_is_fully_train_available
    expression: >
      user_cohort <> 'new_user'
      OR NOT (
        arrival_period = 't1'
        AND current_period = 't2'
      )
      OR is_train_available = true

  - name: previous_new_user_is_not_validation_available
    expression: >
      user_cohort <> 'new_user'
      OR NOT (
        arrival_period = 't1'
        AND current_period = 't2'
      )
      OR is_validation_available = false

  - name: final_holdout_is_never_available
    expression: >
      user_cohort <> 'final_holdout'
      OR (
        is_train_available = false
        AND is_validation_available = false
      )

  - name: excluded_is_never_available
    expression: >
      user_cohort <> 'excluded'
      OR (
        is_train_available = false
        AND is_validation_available = false
      )

  - name: train_is_subset_of_validation_except_previous_new_users
    expression: >
      (
        user_cohort = 'new_user'
        AND arrival_period = 't1'
        AND current_period = 't2'
      )
      OR is_train_available = false
      OR is_validation_available = true
  
  - name: final_holdout_initial_evaluation_availability
    expression: >
      user_cohort <> 'final_holdout'
      OR current_period <> 'initial'
      OR is_evaluation_available =
         (order_number <= order_history - 2)

  - name: final_holdout_t1_evaluation_availability
    expression: >
      user_cohort <> 'final_holdout'
      OR current_period <> 't1'
      OR is_evaluation_available =
         (order_number <= order_history - 1)

  - name: final_holdout_t2_evaluation_availability
    expression: >
      user_cohort <> 'final_holdout'
      OR current_period <> 't2'
      OR is_evaluation_available =
         (order_number <= order_history)

  - name: evaluation_available_only_for_final_holdout
    expression: >
      user_cohort = 'final_holdout'
      OR is_evaluation_available = false