dataset:
  name: aisle_history_data
  description: >
    One row per user and aisle, containing historical aisle-ordering
    behavior derived from the user's prior orders.
  format: parquet
  allow_extra_columns: false

  grain:
    - user_id
    - aisle_id

schema:
  - name: user_id
    type: integer
    nullable: false
    constraints:
      minimum: 1

  - name: aisle_id
    type: integer
    nullable: false
    constraints:
      minimum: 1

  - name: department_id
    type: integer
    nullable: false
    constraints:
      minimum: 1

  - name: eval_set
    type: string
    nullable: false
    constraints:
      allowed_values:
        - train
        - prior

  - name: is_ordered_history
    type: string
    nullable: false
    constraints:
      minimum_string_length: 1
      pattern: "^[01]( [01])*$"

  - name: position_in_order
    type: string
    nullable: false
    constraints:
      minimum_string_length: 1
      pattern: "^[0-9]+( [0-9]+)*$"

  - name: num_products_from_aisle
    type: string
    nullable: false
    constraints:
      minimum_string_length: 1
      pattern: "^[0-9]+( [0-9]+)*$"

  - name: aisle_history_size
    type: string
    nullable: false
    constraints:
      minimum_string_length: 1
      pattern: "^[0-9]+( [0-9]+)*$"
  
  - name: days_since_prior_orders
    type: string
    nullable: false
    constraints:
      minimum_string_length: 1

  - name: order_dows
    type: string
    nullable: false
    constraints:
      minimum_string_length: 1
      pattern: "^[0-6]( [0-6])*$"

  - name: order_hours
    type: string
    nullable: false
    constraints:
      minimum_string_length: 1
      pattern: "^([0-9]|1[0-9]|2[0-3])( ([0-9]|1[0-9]|2[0-3]))*$"

  - name: order_numbers
    type: string
    nullable: false
    constraints:
      minimum_string_length: 1
      pattern: "^[1-9][0-9]*( [1-9][0-9]*)*$"

derived_fields:
  - name: order_numbers_length
    expression: size(split(order_numbers, ' '))

  - name: order_dows_length
    expression: size(split(order_dows, ' '))
  
  - name: order_hours_length
    expression: size(split(order_hours, ' '))
  
  - name: days_since_prior_orders_length
    expression: size(split(days_since_prior_orders, ' '))
  
  - name: ordered_history_length
    expression: size(split(is_ordered_history, ' '))
  
  - name: pos_history_length
    expression: size(split(position_in_order, ' '))
  
  - name: order_size_length
    expression: size(split(aisle_history_size, ' '))

  - name: num_products_from_aisle_length
    expression: size(split(num_products_from_aisle, ' '))
  
rules:
  - name: all_historical_data_has_the_same_length
    expression: >
      ordered_history_length = pos_history_length
      AND ordered_history_length = order_size_length
      AND ordered_history_length = num_products_from_aisle_length
  
  - name: all_temporal_data_has_the_same_length
    expression: >
      order_numbers_length = order_dows_length
      AND order_numbers_length = order_hours_length
      AND order_numbers_length = days_since_prior_orders_length
  
  - name: temporal_data_has_one_more_step_than_historical_data
    expression: >
      order_numbers_length = 1
      OR order_numbers_length - ordered_history_length = 1
  
  - name: unordered_product_position_is_zero
    expression: >
      forall(
          arrays_zip(
            transform(split(is_ordered_history, ' '), x -> cast(x as int)),
            transform(split(position_in_order, ' '), x -> cast(x as int))
          ),
          x -> x['0'] = 1 OR x['1'] = 0
        )

  - name: ordered_product_has_positive_position
    expression: >
      forall(
          arrays_zip(
            transform(split(is_ordered_history, ' '), x -> cast(x as int)),
            transform(split(position_in_order, ' '), x -> cast(x as int))
          ),
          x -> x['0'] = 0 OR x['1'] > 0
        )
    
  - name: product_position_does_not_exceed_order_size
    expression: >
      forall(
        arrays_zip(
          transform(split(position_in_order, ' '), x -> cast(x as int)),
          transform(split(aisle_history_size, ' '), x -> cast(x as int))
        ),
        x -> x['0'] <= x['1']
      )