dataset:
  name: order_products
  description: >
    Order-product level dataset enriched with deterministic user cohorts,
    development splits, simulation periods, and train/validation
    availability for the current simulation period.
  grain:
    - order_id
    - product_id
  allow_extra_columns: false

schema:
  - name: product_id
    type: integer
    nullable: false
    constraints:
      minimum: 1

  - name: order_id
    type: integer
    nullable: false
    constraints:
      minimum: 1

  - name: add_to_cart_order
    type: integer
    nullable: false
    constraints:
      minimum: 1

  - name: reordered
    type: integer
    nullable: false
    constraints:
      allowed_values:
        - 0
        - 1

  - name: user_id
    type: integer
    nullable: false
    constraints:
      minimum: 1

  - name: eval_set
    type: string
    nullable: false
    constraints:
      allowed_values:
        - prior
        - train

  - name: order_number
    type: integer
    nullable: false
    constraints:
      minimum: 1

  - name: order_dow
    type: integer
    nullable: false
    constraints:
      minimum: 0
      maximum: 6

  - name: order_hour_of_day
    type: integer
    nullable: false
    constraints:
      minimum: 0
      maximum: 23

  - name: days_since_prior_order
    type: double
    nullable: false
    constraints:
      minimum: -1.0

  - name: order_history
    type: integer
    nullable: false
    constraints:
      minimum: 1

  - name: user_cohort
    type: string
    nullable: false
    constraints:
      allowed_values:
        - established
        - new_user
        - final_holdout
        - excluded

  - name: development_split
    type: string
    nullable: true
    constraints:
      allowed_values:
        - base_train
        - stacking_train

  - name: arrival_period
    type: string
    nullable: true
    constraints:
      allowed_values:
        - t1
        - t2

  - name: simulation_period
    type: string
    nullable: false
    constraints:
      allowed_values:
        - initial
        - validation
        - t1
        - t2
        - new_user_pool
        - final_holdout
        - excluded

  - name: current_period
    type: string
    nullable: false
    constraints:
      allowed_values:
        - initial
        - t1
        - t2

  - name: is_train_available
    type: boolean
    nullable: false

  - name: is_validation_available
    type: boolean
    nullable: false
  
  - name: is_evaluation_available
    type: boolean
    nullable: false

  - name: product_name
    type: string
    nullable: false
    constraints:
      minimum_string_length: 1

  - name: aisle_id
    type: integer
    nullable: false
    constraints:
      minimum: 1

  - name: department_id
    type: integer
    nullable: false
    constraints:
      minimum: 1


derived_fields:
  - name: arrival_period_constant_per_new_user
    partition_by:
      - user_id
    aggregation: count_distinct
    column: arrival_period

  - name: development_split_constant_per_user
    partition_by:
      - user_id
    aggregation: count_distinct
    column: development_split

  - name: user_cohort_constant_per_user
    partition_by:
      - user_id
    aggregation: count_distinct
    column: user_cohort

  - name: order_history_constant_per_user
    partition_by:
      - user_id
    aggregation: count_distinct
    column: order_history

  - name: current_period_constant_per_user
    partition_by:
      - user_id
    aggregation: count_distinct
    column: current_period


rules:
  - name: first_order_has_no_prior_interval
    expression: >
      order_number <> 1
      OR days_since_prior_order = -1.0

  - name: later_orders_must_have_prior_interval
    expression: >
      order_number = 1
      OR days_since_prior_order >= 0

  - name: order_number_within_order_history
    expression: >
      order_number <= order_history

  - name: established_users_have_development_split
    expression: >
      user_cohort <> 'established'
      OR development_split IS NOT NULL

  - name: non_established_users_have_no_development_split
    expression: >
      user_cohort = 'established'
      OR development_split IS NULL

  - name: new_users_have_arrival_period
    expression: >
      user_cohort <> 'new_user'
      OR arrival_period IS NOT NULL

  - name: non_new_users_have_no_arrival_period
    expression: >
      user_cohort = 'new_user'
      OR arrival_period IS NULL

  - name: final_holdout_is_not_available
    expression: >
      user_cohort <> 'final_holdout'
      OR (
        is_train_available = false
        AND is_validation_available = false
      )

  - name: excluded_users_are_not_available
    expression: >
      user_cohort <> 'excluded'
      OR (
        is_train_available = false
        AND is_validation_available = false
      )

  - name: established_initial_train_availability
    expression: >
      user_cohort <> 'established'
      OR current_period <> 'initial'
      OR is_train_available =
         (order_number <= order_history - 3)

  - name: established_initial_validation_availability
    expression: >
      user_cohort <> 'established'
      OR current_period <> 'initial'
      OR is_validation_available =
         (order_number <= order_history - 2)

  - name: established_t1_train_availability
    expression: >
      user_cohort <> 'established'
      OR current_period <> 't1'
      OR is_train_available =
         (order_number <= order_history - 2)

  - name: established_t1_validation_availability
    expression: >
      user_cohort <> 'established'
      OR current_period <> 't1'
      OR is_validation_available =
         (order_number <= order_history - 1)

  - name: established_t2_train_availability
    expression: >
      user_cohort <> 'established'
      OR current_period <> 't2'
      OR is_train_available =
         (order_number <= order_history - 1)

  - name: established_t2_validation_availability
    expression: >
      user_cohort <> 'established'
      OR current_period <> 't2'
      OR is_validation_available =
         (order_number <= order_history)

  - name: new_user_before_arrival_is_unavailable
    expression: >
      user_cohort <> 'new_user'
      OR NOT (
        current_period = 'initial'
        OR (
          current_period = 't1'
          AND arrival_period = 't2'
        )
      )
      OR (
        is_train_available = false
        AND is_validation_available = false
      )

  - name: current_new_user_train_availability
    expression: >
      user_cohort <> 'new_user'
      OR arrival_period <> current_period
      OR is_train_available =
         (order_number <= order_history - 1)

  - name: current_new_user_validation_availability
    expression: >
      user_cohort <> 'new_user'
      OR arrival_period <> current_period
      OR is_validation_available =
         (order_number <= order_history)

  - name: previous_new_user_train_availability
    expression: >
      user_cohort <> 'new_user'
      OR NOT (
        arrival_period = 't1'
        AND current_period = 't2'
      )
      OR is_train_available = true

  - name: previous_new_user_validation_unavailable
    expression: >
      user_cohort <> 'new_user'
      OR NOT (
        arrival_period = 't1'
        AND current_period = 't2'
      )
      OR is_validation_available = false

  - name: train_is_subset_of_validation_except_previous_new_users
    expression: >
      (
        user_cohort = 'new_user'
        AND arrival_period = 't1'
        AND current_period = 't2'
      )
      OR is_train_available = false
      OR is_validation_available = true

  - name: user_constant_arrival_period
    expression: >
      arrival_period_constant_per_new_user <= 1

  - name: user_constant_development_split
    expression: >
      development_split_constant_per_user <= 1

  - name: user_cohort_constant
    expression: >
      user_cohort_constant_per_user = 1

  - name: order_history_constant
    expression: >
      order_history_constant_per_user = 1

  - name: current_period_constant
    expression: >
      current_period_constant_per_user = 1
  
  - name: non_holdout_users_are_not_evaluation_available
    expression: >
      user_cohort = 'final_holdout'
      OR is_evaluation_available = false

  - name: final_holdout_initial_evaluation_availability
    expression: >
      user_cohort <> 'final_holdout'
      OR current_period <> 'initial'
      OR is_evaluation_available =
         (order_number <= order_history - 2)

  - name: final_holdout_t1_evaluation_availability
    expression: >
      user_cohort <> 'final_holdout'
      OR current_period <> 't1'
      OR is_evaluation_available =
         (order_number <= order_history - 1)

  - name: final_holdout_t2_evaluation_availability
    expression: >
      user_cohort <> 'final_holdout'
      OR current_period <> 't2'
      OR is_evaluation_available =
         (order_number <= order_history)