dataset:
  grain:
    - order_id
    - product_id
  allow_extra_columns: false

schema:
  - name: product_id
    type: integer
    nullable: false
    constraints:
      minimum: 1

  - name: order_id
    type: integer
    nullable: false
    constraints:
      minimum: 1

  - name: add_to_cart_order
    type: integer
    nullable: false
    constraints:
      minimum: 1

  - name: reordered
    type: integer
    nullable: false
    constraints:
      allowed_values:
        - 0
        - 1

  - name: user_id
    type: integer
    nullable: false
    constraints:
      minimum: 1

  - name: eval_set
    type: string
    nullable: false
    constraints:
      allowed_values:
        - prior
        - train

  - name: order_number
    type: integer
    nullable: false
    constraints:
      minimum: 1

  - name: order_dow
    type: integer
    nullable: false
    constraints:
      minimum: 0
      maximum: 6

  - name: order_hour_of_day
    type: integer
    nullable: false
    constraints:
      minimum: 0
      maximum: 23
  
  - name: days_since_prior_order
    type: double
    nullable: false
    constraints:
      minimum: -1.0

  - name: product_name
    type: string
    nullable: false
    constraints:
      minimum_string_length: 1

  - name: aisle_id
    type: integer
    nullable: false
    constraints:
      minimum: 1

  - name: department_id
    type: integer
    nullable: false
    constraints:
      minimum: 1