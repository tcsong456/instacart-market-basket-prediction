name: Run Stacking GBM Training

on:
  workflow_dispatch:
    inputs:
      timeline:
        description: "Simulation timeline"
        required: true
        type: choice
        options:
          - initial
          - t1
          - t2

      mode:
        description: "Use sample or curated data"
        required: true
        type: choice
        options:
          - sample
          - curated

      stack_id:
        description: "Existing stack directory name. Leave empty to select the latest runs."
        required: false
        type: string
        default: ""

jobs:
  train:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Set image URI
        run: |
          echo "TRAINING_IMAGE=europe-west1-docker.pkg.dev/instacart-basket/instacart-basket-prediction/instacart-ml:latest" >> "$GITHUB_ENV"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.TRAINING_RUNNER_SA }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Submit stacking training
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          args=(
            --git-commit "${GITHUB_SHA}"
            --image "${TRAINING_IMAGE}"
            --template-id "${{ vars.RUNPOD_TEMPLATE_ID }}"
            --runs-root "${{ vars.RUNS_BUCKET_URI }}"
          )
          if [[ -n "${{ inputs.stack_id }}" ]]; then
            args+=(--stack-id "${{ inputs.stack_id }}")
          else
            args+=(--mode "${{ inputs.mode }}" --timeline "${{ inputs.timeline }}")
          fi
          python -m instacart_platform.stacking_submit_training_job "${args[@]}"
