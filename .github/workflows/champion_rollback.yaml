name: Champion Rollback

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Dataset mode whose production champion should be restored"
        required: true
        type: choice
        options:
          - sample
          - curated

jobs:
  rollback:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: champion-rollback@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Install package
        run: pip install -e .

      - name: Restore the previous champion
        run: |
          python -m instacart_platform.rollback_champion \
            --runs-root "${{ vars.RUNS_BUCKET_URI }}" \
            --mode "${{ inputs.mode }}"
