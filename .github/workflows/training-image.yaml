name: Build Training Image

on:
  push:
    branches:
      - main
    paths:
      - "src/instacart_rnn/**"
      - "src/instacart_platform/**"
      - "docker/training/**"
      - "pyproject.toml"
      - ".github/workflows/training-image.yaml"

  workflow_dispatch:

jobs:
  build-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.TRAINING_IMAGE_BUILDER_SA }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Docker
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and push training image
        run: |
          IMAGE_BASE="europe-west1-docker.pkg.dev/instacart-basket/instacart-basket-prediction/instacart-ml"

          docker build \
            -f docker/training/Dockerfile \
            -t "${IMAGE_BASE}:${GITHUB_SHA}" \
            -t "${IMAGE_BASE}:latest" \
            .

          docker push "${IMAGE_BASE}:${GITHUB_SHA}"
          docker push "${IMAGE_BASE}:latest"
